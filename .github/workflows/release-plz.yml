name: Release-plz

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-plz-pr:
    needs: validate
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-plz (release-pr)
        uses: near/shared-workflows/release-plz@main
        with:
          command: release-pr
          crate-toolchain-version: stable
          crate-build-target-arch: x86_64-unknown-linux-gnu
        env:
          GITHUB_TOKEN: ${{ secrets.NEARPROTOCOL_CI_PR_ACCESS }}

  release-plz-release:
    needs: validate
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    # Never cancel an in-flight publish — half-published releases are worse than waiting.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run release-plz (release)
        id: release-plz
        uses: near/shared-workflows/release-plz@main
        with:
          command: release
          crate-toolchain-version: stable
          crate-build-target-arch: x86_64-unknown-linux-gnu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attest the archives produced by cargo publish.
      - name: Attest build provenance
        if: steps.release-plz.outputs.releases_created == 'true'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/package/**/*.crate
